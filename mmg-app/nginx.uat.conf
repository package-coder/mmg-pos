server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — React Router handles the path client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets are safe to cache long-term; index.html is not.
    location ~* \.(?:js|css|png|jpg|jpeg|svg|ico|woff2?)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
