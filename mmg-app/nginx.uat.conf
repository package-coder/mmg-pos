server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Without this, JS/CSS chunks are served uncompressed — the main bundle
    # alone is ~1.7MB raw vs. ~350KB gzipped (see build output), which made
    # first loads very slow, especially from a distant client (this box is
    # in ap-northeast-2).
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
        text/javascript application/xml text/xml image/svg+xml font/woff2;

    # SPA fallback — React Router handles the path client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Always revalidate index.html so a redeploy is picked up immediately; a stale copy points
    # at old hashed chunks that no longer exist ("Failed to fetch dynamically imported module").
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Hashed build assets are safe to cache long-term; index.html is not.
    location ~* \.(?:js|css|png|jpg|jpeg|svg|ico|woff2?)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
