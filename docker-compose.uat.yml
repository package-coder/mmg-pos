# Admin/UAT deployment — centralized instance, no POS routes.
# Same stack shape as docker-compose.yml, but:
#   - app runs with VITE_ROLE=admin (hides POS routes, unlocks master-data routes)
#   - frontend is on port 80 (no port needed in the URL)
#   - no `proxy` service: it's just a pass-through to `server` plus legacy
#     printer/VFD HTTP endpoints, neither useful on a cloud box with no
#     hardware attached. The frontend talks directly to `server` instead.
# Run:    docker-compose -f docker-compose.uat.yml up --build -d
# Seed:   docker-compose -f docker-compose.uat.yml exec server python seed.py
#
# Ports exposed to host:
#   80   → mmg-app  (frontend)
#   8001 → server   (Flask API — this is what the browser calls directly)
#   8003 → mongo    (needed by branch servers' `sync` to reach this instance)

services:

  app:
    build: ./mmg-app
    image: chrisn0tdev/pos-client
    platform: linux/amd64
    ports:
      - "80:5173"
    depends_on:
      - server
    volumes:
      - ./mmg-app:/app
      - /app/node_modules
    environment:
      - VITE_APP_ENV=internal-production
      - VITE_APP_BASE_NAME=/
      - VITE_APP_SERVER_PORT=8001
      - VITE_ROLE=admin
      # TEMPORARY — reopens POS routes on this admin instance for testing.
      # Turn back to false once testing is done; see PosRoutes.jsx.
      - VITE_ALLOW_POS_ON_ADMIN=true
    restart: always

  server:
    build: ./pos-api
    image: chrisn0tdev/pos-app
    platform: linux/amd64
    ports:
      - "8001:5100"
    depends_on:
      - mongo
    networks:
      - pos-network
    env_file:
      - pos-api/.env
    environment:
      - LOCAL_DATABASE_URL=mongodb://mongo:27017
      - APP_ENV=internal-production
    restart: always

  # No further upstream to sync to from here — this instance IS the top of the
  # sync hierarchy. Kept so branch servers' downstream pulls (users/packages/
  # discounts/etc. pushed here) have something to read from; REMOTE_DATABASE_URL
  # in pos-api/.env stays a placeholder and this service just logs "client
  # unavailable" and skips each cycle harmlessly (see CLAUDE.md).
  sync:
    build: ./pos-api/sync
    image: chrisn0tdev/pos-sync
    platform: linux/amd64
    depends_on:
      - mongo
    networks:
      - pos-network
    env_file:
      - pos-api/.env
    environment:
      - LOCAL_DATABASE_URL=mongodb://mongo:27017
    restart: always

  mongo:
    image: mongo:7
    ports:
      - "8003:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - pos-network
    restart: always

networks:
  pos-network:
    driver: bridge

volumes:
  mongo-data:
    driver: local
