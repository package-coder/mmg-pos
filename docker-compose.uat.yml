# Admin/UAT deployment — centralized instance, no POS routes.
# Same stack shape as docker-compose.yml, but:
#   - app runs with VITE_ROLE=admin (hides POS routes, unlocks master-data routes)
#   - frontend is on port 80 (no port needed in the URL)
#   - no `proxy` service: it's just a pass-through to `server` plus legacy
#     printer/VFD HTTP endpoints, neither useful on a cloud box with no
#     hardware attached. The frontend talks directly to `server` instead.
# Run:    docker-compose -f docker-compose.uat.yml up --build -d
# Seed:   docker-compose -f docker-compose.uat.yml exec server python seed.py
#
# Ports exposed to host:
#   80   → mmg-app  (frontend)
#   8001 → server   (Flask API — this is what the browser calls directly)
#   8003 → mongo    (needed by branch servers' `sync` to reach this instance)

services:

  app:
    # Production build served by nginx — NOT the Vite dev server (that's what
    # docker-compose.yml uses for branch/LAN deployments). The dev server
    # re-optimizes dependencies on first access to a not-yet-bundled import
    # and force-reloads every connected browser tab over its HMR websocket;
    # on a shared UAT box hit by multiple testers that looked like the app
    # randomly restarting. VITE_* values are baked into the bundle at build
    # time here (see mmg-app/Dockerfile.uat), not read at container runtime.
    build:
      context: ./mmg-app
      dockerfile: Dockerfile.uat
      args:
        - VITE_APP_ENV=internal-production
        - VITE_APP_BASE_NAME=/
        - VITE_APP_SERVER_PORT=8001
        - VITE_ROLE=admin
    image: chrisn0tdev/pos-client
    platform: linux/amd64
    ports:
      - "80:80"
    depends_on:
      - server
    restart: always

  server:
    build: ./pos-api
    image: chrisn0tdev/pos-app
    platform: linux/amd64
    ports:
      - "8001:5100"
    depends_on:
      - mongo
    networks:
      - pos-network
    env_file:
      - pos-api/.env
    environment:
      - LOCAL_DATABASE_URL=mongodb://mongo:27017
      - APP_ENV=internal-production
    restart: always

  mongo:
    image: mongo:7
    ports:
      - "8003:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - pos-network
    restart: always

networks:
  pos-network:
    driver: bridge

volumes:
  mongo-data:
    driver: local
